name: Build Beyond Words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Guante-De-Voz-App

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar estructura
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar plataforma Android sin sobrescribir
        run: |
          rm -rf /tmp/bw_android
          flutter create \
            --platforms=android \
            --org com.beyondword \
            --project-name beyond_words \
            /tmp/bw_android
          rm -rf android
          cp -R /tmp/bw_android/android ./android

      - name: Configurar compileSdk 36, targetSdk 34 y minSdk 23
        run: |
          GRADLE_FILE=$(find android/app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          echo "Gradle file encontrado: $GRADLE_FILE"
          if [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = [0-9]*/minSdk = 23/' "$GRADLE_FILE" || true
          else
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' "$GRADLE_FILE" || true
          fi
          echo "=== Contenido del archivo Gradle ==="
          cat "$GRADLE_FILE"

      - name: Configurar compileSdk en build.gradle raíz
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/build.gradle || true
            cat android/build.gradle
          fi
          if [ -f android/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/build.gradle.kts || true
            cat android/build.gradle.kts
          fi

      - name: Escribir AndroidManifest con permisos BLE
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le"
                  android:required="true" />
              <application
                  android:label="Beyond Words"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Restaurar dependencias
        run: flutter pub get

      - name: Analizar
        run: flutter analyze || true

      - name: Compilar APK release
        run: |
          export GRADLE_OPTS="-I $PWD/init.gradle"
          flutter build apk --release --no-tree-shake-icons

      - name: Verificar APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Words-APK
          path: Guante-De-Voz-App/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
